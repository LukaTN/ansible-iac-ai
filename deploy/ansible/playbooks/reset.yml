---
# Tears down kubeadm on .18 and .12. Does NOT remove containerd/kubelet
# packages or touch the ansible-control node (.19). Re-run site.yml
# afterwards to rebuild the cluster.
- name: Reset kubeadm on all cluster nodes
  hosts: k8s_cluster
  become: true
  tasks:
    - name: kubeadm reset (force, no confirmation prompt)
      ansible.builtin.command: kubeadm reset -f
      changed_when: true

    - name: Remove Kubernetes config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /etc/cni/net.d
        - "/home/{{ ansible_user }}/.kube"

    - name: Flush iptables rules left by kube-proxy/Calico
      ansible.builtin.command: "{{ item }}"
      loop:
        - iptables -F
        - iptables -t nat -F
        - iptables -t mangle -F
        - iptables -X
      changed_when: true
      failed_when: false

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
      failed_when: false

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      failed_when: false

- name: Clean up local artifacts on the control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_local_path: "{{ playbook_dir }}/../artifacts/kubeconfig"
    join_command_local_path: "{{ playbook_dir }}/../artifacts/kubeadm_join.sh"
  tasks:
    - name: Remove stale kubeconfig and join command
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ kubeconfig_local_path }}"
        - "{{ join_command_local_path }}"
