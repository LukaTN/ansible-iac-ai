---
# Full cluster bootstrap:
#   common + containerd + kubernetes  -> all nodes
#   k8s_control_plane + k8s_cni       -> master only (kubeadm init, Calico)
#   k8s_worker                        -> worker only (kubeadm join)
#   k8s_kubeconfig                    -> fetch admin.conf to this control node
#   k8s_addons                        -> ingress-nginx + cert-manager (tag: addons)

- name: Prepare all cluster nodes (OS, containerd, kubeadm/kubelet/kubectl)
  hosts: k8s_cluster
  become: true
  tags: [prepare]
  roles:
    - common
    - containerd
    - kubernetes

- name: Initialize the Kubernetes control plane
  hosts: k8s_master
  become: true
  tags: [control_plane]
  roles:
    - k8s_control_plane
    - k8s_cni

- name: Join worker node(s) to the cluster
  hosts: k8s_worker
  become: true
  tags: [worker]
  roles:
    - k8s_worker

- name: Fetch kubeconfig to the Ansible control node
  hosts: k8s_master
  become: true
  tags: [kubeconfig]
  roles:
    - k8s_kubeconfig

- name: Install cluster addons (ingress-nginx, cert-manager)
  hosts: k8s_master
  become: true
  tags: [addons]
  roles:
    - k8s_addons
