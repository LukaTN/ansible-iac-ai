---
- name: Install Kubernetes apt prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  tags: [kubernetes, packages]

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_apt_key_path | dirname }}"
    state: directory
    mode: "0755"
  tags: [kubernetes, repo]

- name: Add Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_apt_channel }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-release.key
    mode: "0644"
  tags: [kubernetes, repo]

- name: Dearmor Kubernetes apt key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output {{ kubernetes_apt_key_path }} /tmp/kubernetes-apt-release.key
  args:
    creates: "{{ kubernetes_apt_key_path }}"
  tags: [kubernetes, repo]

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_apt_repo }}"
    filename: kubernetes
    state: present
  tags: [kubernetes, repo]

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ kubernetes_packages }}"
    state: present
    update_cache: true
  tags: [kubernetes, packages]

- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_package_hold }}"
  tags: [kubernetes, packages]

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
  tags: [kubernetes, kubelet]
