---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes apt GPG key
  ansible.builtin.get_url:
    url: "{{ k8s_repo_gpg_url }}"
    dest: /tmp/kubernetes-release.key
    mode: "0644"

- name: Dearmor Kubernetes GPG key
  ansible.builtin.command: >
    gpg --batch --yes --dearmor
    -o {{ k8s_repo_keyring }} /tmp/kubernetes-release.key
  args:
    creates: "{{ k8s_repo_keyring }}"

- name: Add pkgs.k8s.io apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ k8s_repo_keyring }}] {{ k8s_repo_url }} /"
    filename: kubernetes
    state: present

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name: >-
      {{ k8s_packages | map('regex_replace', '$', '=' + kubernetes_package_version) | list }}
    state: present
    update_cache: true
  when: kubernetes_package_version is defined and kubernetes_package_version | length > 0

- name: Install kubelet, kubeadm, kubectl (unpinned)
  ansible.builtin.apt:
    name: "{{ k8s_packages }}"
    state: present
    update_cache: true
  when: kubernetes_package_version is not defined or kubernetes_package_version | length == 0

- name: Hold kubelet, kubeadm, kubectl at installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_packages }}"

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
    daemon_reload: true

- name: Disable UFW/firewall interference (lab-only convenience)
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped
  failed_when: false
