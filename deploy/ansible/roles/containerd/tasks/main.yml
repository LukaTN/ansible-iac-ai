---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
  tags: [containerd, packages]

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: "{{ containerd_config_path | dirname }}"
    state: directory
    mode: "0755"
  tags: [containerd, config]

- name: Write containerd config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_path }}"
    mode: "0644"
    owner: root
    group: root
  notify: Restart containerd
  tags: [containerd, config]

- name: Ensure containerd is enabled and started
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
  tags: [containerd, service]
