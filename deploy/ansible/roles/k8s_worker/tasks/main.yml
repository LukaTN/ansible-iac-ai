---
- name: Check whether this node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Read the join command saved by k8s_control_plane
  ansible.builtin.slurp:
    src: "{{ join_command_local_path }}"
  register: join_command_file
  delegate_to: localhost
  become: false
  when: not kubelet_conf.stat.exists

- name: Run kubeadm join
  ansible.builtin.command: "{{ (join_command_file.content | b64decode).strip() }}"
  when: not kubelet_conf.stat.exists

- name: Wait for kubelet to be active on the worker
  ansible.builtin.systemd:
    name: kubelet
    state: started
  register: kubelet_status
  until: kubelet_status.status.ActiveState == 'active'
  retries: 10
  delay: 5

- name: Wait for this worker to register as Ready in the cluster
  kubernetes.core.k8s_info:
    kind: Node
    name: "{{ inventory_hostname }}"
    kubeconfig: /etc/kubernetes/admin.conf
  register: worker_node_status
  delegate_to: "{{ groups['k8s_master'][0] }}"
  until: >
    worker_node_status.resources | length > 0 and
    worker_node_status.resources[0].status.conditions
    | selectattr('type', 'equalto', 'Ready')
    | map(attribute='status')
    | first == 'True'
  retries: 30
  delay: 10
