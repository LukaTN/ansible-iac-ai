---
calico_version: v3.29.2
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
calico_manifest_local: "/tmp/calico-{{ calico_version }}.yaml"
# Pin node IP selection to the lab LAN (avoids docker0 / wrong NIC autodetect).
calico_ip_autodetection_method: "cidr=192.168.1.0/24"
calico_rollout_timeout: 600s
k8s_admin_kubeconfig: /etc/kubernetes/admin.conf
