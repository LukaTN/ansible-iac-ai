---
- name: Download pinned Calico manifest
  ansible.builtin.get_url:
    url: "{{ calico_manifest_url }}"
    dest: /tmp/calico-{{ calico_version }}.yaml
    mode: "0644"

- name: Apply Calico CNI manifest
  kubernetes.core.k8s:
    state: present
    src: /tmp/calico-{{ calico_version }}.yaml
    kubeconfig: /etc/kubernetes/admin.conf

- name: Wait for all Calico pods to be Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: kube-system
    label_selectors:
      - "k8s-app=calico-node"
    kubeconfig: /etc/kubernetes/admin.conf
  register: calico_pods
  until: >
    calico_pods.resources | length > 0 and
    calico_pods.resources | map(attribute='status.phase') | list | unique == ['Running']
  retries: 30
  delay: 10

- name: Wait for the control-plane node to report Ready
  kubernetes.core.k8s_info:
    kind: Node
    name: "{{ inventory_hostname }}"
    kubeconfig: /etc/kubernetes/admin.conf
  register: master_node_status
  until: >
    master_node_status.resources[0].status.conditions
    | selectattr('type', 'equalto', 'Ready')
    | map(attribute='status')
    | first == 'True'
  retries: 30
  delay: 10
