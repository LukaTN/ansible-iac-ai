---
- name: Ensure local artifacts directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Fetch admin.conf from the control-plane node
  ansible.builtin.fetch:
    src: "{{ kubeconfig_remote_path }}"
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Restrict permissions on the local kubeconfig
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Point the local kubeconfig at the master's advertised IP
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_path }}"
    regexp: 'server: https://.*:{{ k8s_api_server_port }}'
    replace: "server: https://{{ ansible_host }}:{{ k8s_api_server_port }}"
  delegate_to: localhost
  become: false
