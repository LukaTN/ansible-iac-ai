---
- name: Check whether this node is already an initialized control plane
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ ansible_host }}
      --control-plane-endpoint={{ k8s_control_plane_endpoint }}
      --pod-network-cidr={{ k8s_pod_subnet }}
      {{ '--apiserver-cert-extra-sans=' + (k8s_api_server_cert_sans | join(',')) if k8s_api_server_cert_sans | length > 0 else '' }}
      --upload-certs
  when: not admin_conf.stat.exists
  register: kubeadm_init_result

- name: Save raw kubeadm init output for troubleshooting
  ansible.builtin.copy:
    content: "{{ kubeadm_init_result.stdout }}"
    dest: /root/kubeadm-init.log
    mode: "0600"
  when: kubeadm_init_result is changed

- name: Create .kube directory for the ansible_user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin.conf to ansible_user's kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Wait for the API server to answer locally
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw=/healthz
  register: api_health
  until: api_health.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Generate a fresh kubeadm join command for workers
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Ensure local artifacts directory exists on the control node
  ansible.builtin.file:
    path: "{{ join_command_local_path | dirname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Persist the join command locally so the worker play can read it
  ansible.builtin.copy:
    content: "{{ kubeadm_join_command.stdout }}\n"
    dest: "{{ join_command_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
