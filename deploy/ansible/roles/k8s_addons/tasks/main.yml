---
- name: Detect CPU architecture for Helm
  ansible.builtin.set_fact:
    helm_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'arm64' }}"
  tags: [addons, helm]

- name: Check installed Helm version
  ansible.builtin.command:
    cmd: "{{ helm_binary }} version --short"
  register: helm_installed
  changed_when: false
  failed_when: false
  tags: [addons, helm]

- name: Create Helm extract directory
  ansible.builtin.file:
    path: "/tmp/helm-{{ helm_version }}"
    state: directory
    mode: "0755"
  when: helm_installed.rc != 0 or helm_version not in (helm_installed.stdout | default(''))
  tags: [addons, helm]

- name: Download and extract Helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}"
    remote_src: true
  when: helm_installed.rc != 0 or helm_version not in (helm_installed.stdout | default(''))
  tags: [addons, helm]

- name: Install Helm binary
  ansible.builtin.copy:
    src: "/tmp/helm-{{ helm_version }}/linux-{{ helm_arch }}/helm"
    dest: "{{ helm_binary }}"
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  when: helm_installed.rc != 0 or helm_version not in (helm_installed.stdout | default(''))
  tags: [addons, helm]

- name: Add ingress-nginx Helm repository
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: https://kubernetes.github.io/ingress-nginx
    binary_path: "{{ helm_binary }}"
  environment:
    KUBECONFIG: "{{ k8s_admin_kubeconfig }}"
  tags: [addons, ingress]

- name: Install ingress-nginx
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    chart_version: "{{ ingress_nginx_chart_version }}"
    release_namespace: ingress-nginx
    create_namespace: true
    kubeconfig: "{{ k8s_admin_kubeconfig }}"
    binary_path: "{{ helm_binary }}"
    wait: true
    timeout: 10m0s
    values:
      controller:
        allowSnippetAnnotations: false
  tags: [addons, ingress]

- name: Add jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
    binary_path: "{{ helm_binary }}"
  environment:
    KUBECONFIG: "{{ k8s_admin_kubeconfig }}"
  tags: [addons, cert-manager]

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ k8s_admin_kubeconfig }}"
    binary_path: "{{ helm_binary }}"
    wait: true
    timeout: 10m0s
    values:
      crds:
        enabled: true
  tags: [addons, cert-manager]
