---
# ---------------------------------------------------------------------------
# Pinned versions — bump deliberately, never float "latest" in a lab/prod repo
# ---------------------------------------------------------------------------
kubernetes_version: "1.30"                 # pkgs.k8s.io repo channel, e.g. v1.30
kubernetes_package_version: "1.30.*"       # apt version pin for kubelet/kubeadm/kubectl
containerd_version: ""                     # empty = latest from repo; set to pin e.g. "1.7.20-1"

calico_version: "v3.28.0"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

ingress_nginx_chart_version: "4.11.2"
cert_manager_chart_version: "v1.15.3"

# ---------------------------------------------------------------------------
# Cluster networking
# ---------------------------------------------------------------------------
# Must NOT overlap the lab LAN (192.168.1.0/24) or Calico's own default
# (192.168.0.0/16). Keep this off both.
k8s_pod_subnet: "10.244.0.0/16"
k8s_api_server_port: 6443

# Extra SANs for the API server certificate (e.g. a DNS name or LB VIP).
# The master's own IP/hostname are always included automatically.
k8s_api_server_cert_sans: []

# ---------------------------------------------------------------------------
# Addons (installed unless you run with --skip-tags addons)
# ---------------------------------------------------------------------------
ingress_nodeport_http: 30080
ingress_nodeport_https: 30443

cert_manager_namespace: cert-manager
ingress_nginx_namespace: ingress-nginx

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
kubeconfig_remote_path: /etc/kubernetes/admin.conf
kubeconfig_local_path: "{{ playbook_dir }}/../artifacts/kubeconfig"
join_command_local_path: "{{ playbook_dir }}/../artifacts/kubeadm_join.sh"
