---
# Lab topology (3 VMs on 192.168.1.0/24)
#
#   192.168.1.19  ansible-control   NOT in this inventory — clone the repo here and
#                                   run ansible-playbook (SSH client only)
#   192.168.1.18  k8s-master        Kubernetes control plane (kubeadm init)
#   192.168.1.12  k8s-worker        Kubernetes worker (kubeadm join)
#
# From 192.168.1.19:
#   cd deploy/ansible
#   ansible-playbook playbooks/ping.yml
#   ansible-playbook playbooks/site.yml

all:
  vars:
    ansible_user: ubuntu
    ansible_become: true
    ansible_python_interpreter: auto_silent
    ansible_control_ip: 192.168.1.19
  children:
    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            k8s-master:
              ansible_host: 192.168.1.18
        k8s_workers:
          hosts:
            k8s-worker:
              ansible_host: 192.168.1.12
