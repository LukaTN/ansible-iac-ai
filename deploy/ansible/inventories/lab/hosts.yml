---
# Lab topology
#   192.168.1.19  ansible-control  (this repo runs here, NOT a K8s node)
#   192.168.1.18  k8s-master       (control plane)
#   192.168.1.12  k8s-worker       (worker)

all:
  children:
    k8s_cluster:
      children:
        k8s_master:
          hosts:
            k8s-master:
              ansible_host: 192.168.1.18
        k8s_worker:
          hosts:
            k8s-worker:
              ansible_host: 192.168.1.12
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
