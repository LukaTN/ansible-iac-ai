global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Expect UP once the API image with /metrics is running.
  - job_name: ansibleai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]

  # Phase 6b — Celery queue / worker gauges (danihodovic/celery-exporter).
  - job_name: celery
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-exporter:9808"]
