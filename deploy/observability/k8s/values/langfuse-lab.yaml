# Phase 6c — Langfuse v3 in namespace langfuse (manual sync).
# Chart: langfuse/langfuse 1.5.1 (https://langfuse.github.io/langfuse-k8s)
# Operator UI. Do not put this on the member Ingress (:30080).
#
# Sized for k8s-worker 7Gi / 4 vCPU (with the app + kube-prometheus).
# Chart 1.5.1 keys: langfuse.web.service / langfuse.web.resources / langfuse.worker.resources.
# Nested langfuse.resources.web is invalid K8s Container.resources (unknown field warnings).

langfuse:
  salt:
    value: lab-only-langfuse-salt-change-me
  nextauth:
    url: http://192.168.1.18:30301
    secret:
      value: lab-only-langfuse-nextauth-secret
  encryptionKey:
    value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  web:
    service:
      type: NodePort
      nodePort: 30301
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  worker:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 400m
        memory: 384Mi

postgresql:
  deploy: true
  auth:
    password: lab-only-langfuse-pg
  primary:
    persistence:
      storageClass: local-path
      size: 8Gi
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

clickhouse:
  deploy: true
  auth:
    password: lab-only-langfuse-ch
  # Chart default is replicaCount: 3 + resourcesPreset: 2xlarge.
  replicaCount: 1
  clusterEnabled: false
  resourcesPreset: none
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    storageClass: local-path
    size: 8Gi
  # Bitnami ClickHouse still ships ZK×3 unless this is set. One keeper
  # is enough for a single ClickHouse replica.
  zookeeper:
    replicaCount: 1
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi

redis:
  deploy: true
  auth:
    password: lab-only-langfuse-redis
  # Valkey subchart (1.5.1) uses primary, not master.
  primary:
    persistence:
      storageClass: local-path
      size: 2Gi
    resourcesPreset: none
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi

s3:
  deploy: true
  auth:
    rootPassword: lab-only-langfuse-minio
  persistence:
    storageClass: local-path
    size: 8Gi
  resourcesPreset: none
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
