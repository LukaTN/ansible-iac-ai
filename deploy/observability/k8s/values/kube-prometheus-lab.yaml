# Phase 6c — kube-prometheus-stack on the two-node kubeadm lab.
# Chart: prometheus-community/kube-prometheus-stack 88.5.2
# Never :latest. local-path storage. Small retention.
# Requests sized for k8s-worker 7Gi / 4 vCPU (with AnsibleAI + Langfuse).

fullnameOverride: kube-prometheus

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: true

prometheusOperator:
  admissionWebhooks:
    enabled: false
  # Chart still mounts Secret kube-prometheus-admission when TLS is on.
  # That Secret is only created by the webhook patch Job — without it the
  # operator stays ContainerCreating (FailedMount).
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  adminUser: admin
  adminPassword: lab-only-grafana
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    # Loki and Tempo are additionalDataSources below. The datasource
    # watcher only CrashLooped (OOM at 128Mi on k8s-sidecar 2.10).
    datasources:
      enabled: false
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "trace_id=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
  # Grafana 13's embedded apiserver misses /api/health at 384Mi/300m.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 24h
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: ansibleai-api-annot
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ansibleai
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: ([^:]+)(?::\\d+)?;(\\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component

prometheus-node-exporter:
  hostNetwork: false
  hostPID: false
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
