# Phase 6c — Grafana Alloy DaemonSet: pod logs → Loki.
# Chart: grafana/alloy 1.0.3

controller:
  type: daemonset
  resources: {}

alloy:
  extraPorts: []
  mounts:
    varlog: true
    dockercontainers: false
  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# Chart default pulls quay.io/prometheus-operator/prometheus-config-reloader.
# This lab's worker often resets quay.io (Alloy stays 0/2 ContainerCreating).
# ConfigMap edits still roll the DaemonSet via checksum.
configReloader:
  enabled: false

serviceMonitor:
  enabled: false

serviceAccount:
  create: true
