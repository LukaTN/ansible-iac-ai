{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ansibleai.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $reuse := and $existing (not .Values.secrets.rotate) }}
{{- $pgUser := .Values.secrets.postgresUser }}
{{- $pgPass := .Values.secrets.postgresPassword }}
{{- $pgDb := .Values.secrets.postgresDatabase }}
{{- $redisPass := .Values.secrets.redisPassword }}
{{- $minioUser := .Values.secrets.minioRootUser }}
{{- $minioPass := .Values.secrets.minioRootPassword }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if $reuse }}
{{- $secretKey = index $existing.data "SECRET_KEY" | b64dec }}
{{- $pgPass = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- $minioPass = index $existing.data "MINIO_ROOT_PASSWORD" | b64dec }}
{{- if index $existing.data "REDIS_PASSWORD" }}
{{- $redisPass = index $existing.data "REDIS_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
{{- if not $secretKey }}
{{- fail "secrets.secretKey is required (32+ chars) or set secrets.existingSecret" }}
{{- end }}
{{- if not $pgPass }}
{{- fail "secrets.postgresPassword is required or set secrets.existingSecret" }}
{{- end }}
{{- if not $minioPass }}
{{- fail "secrets.minioRootPassword is required or set secrets.existingSecret" }}
{{- end }}
{{- $pgHost := include "ansibleai.postgresHost" . }}
{{- $redisHost := include "ansibleai.redisHost" . }}
{{- $minioHost := include "ansibleai.minioHost" . }}
{{- $pgUrl := printf "postgresql+psycopg2://%s:%s@%s:5432/%s" $pgUser ($pgPass | urlquery) $pgHost $pgDb }}
{{- $redisAuth := "" }}
{{- if and .Values.redis.auth $redisPass }}
{{- $redisAuth = printf ":%s@" ($redisPass | urlquery) }}
{{- end }}
{{- $redisUrl := printf "redis://%s%s:6379/0" $redisAuth $redisHost }}
{{- $socketioUrl := printf "redis://%s%s:6379/1" $redisAuth $redisHost }}
{{- $celeryUrl := printf "redis://%s%s:6379/2" $redisAuth $redisHost }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
  annotations:
    ansibleai.io/purpose: "Application credentials. Do not copy into ConfigMaps."
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  POSTGRES_USER: {{ $pgUser | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  POSTGRES_DB: {{ $pgDb | quote }}
  DATABASE_URL: {{ $pgUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  SOCKETIO_MESSAGE_QUEUE: {{ $socketioUrl | quote }}
  CELERY_BROKER_URL: {{ $celeryUrl | quote }}
  CELERY_RESULT_BACKEND: {{ $celeryUrl | quote }}
  REDIS_PASSWORD: {{ $redisPass | quote }}
  MINIO_ROOT_USER: {{ $minioUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPass | quote }}
  S3_ACCESS_KEY: {{ $minioUser | quote }}
  S3_SECRET_KEY: {{ $minioPass | quote }}
  S3_ENDPOINT_URL: {{ printf "http://%s:9000" $minioHost | quote }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  KEYCLOAK_ADMIN: {{ .Values.secrets.keycloakAdmin | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}
