{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ansibleai.fullname" . }}-slo
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    release: {{ .Values.observability.releaseLabel | quote }}
  annotations:
    ansibleai.io/purpose: "Phase 6c — PrometheusRule picked up by kube-prometheus-stack (release label)."
spec:
  groups:
    - name: ansibleai.slo
      rules:
        - alert: AnsibleAIHighErrorBudgetBurn
          expr: |
            (
              sum(rate(ansibleai_http_requests_total{status=~"5.."}[1h]))
              /
              sum(rate(ansibleai_http_requests_total[1h]))
            ) > {{ .Values.observability.slo.fastBurnRate }}
            and
            (
              sum(rate(ansibleai_http_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(ansibleai_http_requests_total[5m]))
            ) > {{ .Values.observability.slo.fastBurnRate }}
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "AnsibleAI API is burning the {{ .Values.observability.slo.availability }}% error budget quickly"
            description: "5xx ratio exceeded {{ .Values.observability.slo.fastBurnRate }} on both 1h and 5m windows."
            runbook: {{ .Values.observability.slo.runbook | quote }}
        - alert: AnsibleAIApiNotReady
          expr: kube_deployment_status_replicas_unavailable{deployment="{{ include "ansibleai.fullname" . }}-api"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "AnsibleAI API has unavailable replicas"
            runbook: {{ .Values.observability.slo.runbook | quote }}
    - name: ansibleai.app
      rules:
        - alert: AnsibleAIReadyzFailed
          expr: ansibleai_ready == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "AnsibleAI /readyz last check failed"
            runbook: {{ .Values.observability.slo.runbook | quote }}
        - alert: AnsibleAIGatePassRateDrop
          expr: |
            (
              sum(rate(ansibleai_gate_result_total{result="failed"}[15m]))
              /
              clamp_min(sum(rate(ansibleai_gate_result_total[15m])), 0.001)
            ) > 0.50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Production-gate fail rate is above 50%"
            runbook: {{ .Values.observability.slo.runbook | quote }}
    - name: ansibleai.celery
      rules:
        - alert: AnsibleAICeleryQueueBacklog
          expr: celery_queue_length{queue_name="celery"} > 8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Celery generation queue is backing up"
            runbook: {{ .Values.observability.slo.runbook | quote }}
        - alert: AnsibleAICeleryWorkerDown
          expr: celery_active_worker_count == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No active Celery workers"
            runbook: {{ .Values.observability.slo.runbook | quote }}
{{- end }}
