apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ansibleai.configMapName" . }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
  annotations:
    ansibleai.io/purpose: "Non-secret runtime configuration. Credentials live in the app Secret."
data:
  APP_ENV: {{ .Values.app.env | quote }}
  AUTH_MODE: {{ .Values.app.authMode | quote }}
  REGISTRATION_MODE: {{ .Values.app.registrationMode | quote }}
  ALLOWED_EMAIL_DOMAINS: {{ .Values.app.allowedEmailDomains | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  LOG_FORMAT: {{ .Values.app.logFormat | quote }}
  CORS_ORIGINS: {{ include "ansibleai.corsOrigins" . | quote }}
  GUNICORN_WORKERS: {{ .Values.app.gunicornWorkers | quote }}
  GUNICORN_WORKER_CLASS: {{ .Values.app.gunicornWorkerClass | quote }}
  CELERY_WORKER_CONCURRENCY: {{ .Values.app.celeryWorkerConcurrency | quote }}
  CELERY_MAX_TASKS_PER_CHILD: {{ .Values.app.celeryMaxTasksPerChild | quote }}
  CELERY_TASK_ALWAYS_EAGER: "false"
  SESSION_BACKEND: redis
  RATE_LIMIT_BACKEND: redis
  CANCEL_BACKEND: redis
  LOG_STREAM_BACKEND: redis
  ARTIFACT_BACKEND: s3
  S3_BUCKET: {{ .Values.app.s3Bucket | quote }}
  S3_REGION: {{ .Values.app.s3Region | quote }}
  AGENT_MODEL: {{ .Values.app.agentModel | quote }}
  PLAYBOOK_MODEL: {{ .Values.app.playbookModel | quote }}
  EMBEDDING_MODEL: {{ .Values.app.embeddingModel | quote }}
  EMBEDDING_DIMENSIONS: {{ .Values.app.embeddingDimensions | quote }}
  OLLAMA_BASE_URL: {{ include "ansibleai.ollamaBaseUrl" . | quote }}
  EMBEDDING_BASE_URL: {{ printf "%s/v1" (include "ansibleai.ollamaBaseUrl" .) | quote }}
  LANGFUSE_ENABLED: {{ .Values.app.langfuseEnabled | quote }}
  LANGFUSE_HOST: {{ .Values.app.langfuseHost | quote }}
  LANGFUSE_BASE_URL: {{ .Values.app.langfuseHost | quote }}
  LANGFUSE_TRACING_ENVIRONMENT: {{ .Values.app.langfuseTracingEnvironment | quote }}
  PORT: "5000"
  OIDC_CLIENT_ID: "ansibleai-web"
  OIDC_BROWSER_REDIRECT: "false"
  OIDC_MAP_APP_ADMIN: "false"
{{- if .Values.identity.enabled }}
  OIDC_ISSUER: {{ printf "http://keycloak.%s.svc.cluster.local:8080/realms/ansibleai" .Values.identity.namespace | quote }}
  OIDC_INTERNAL_BASE_URL: {{ printf "http://keycloak.%s.svc.cluster.local:8080" .Values.identity.namespace | quote }}
{{- else }}
  OIDC_ISSUER: ""
  OIDC_INTERNAL_BASE_URL: ""
{{- end }}
