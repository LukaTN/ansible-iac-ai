{{- if .Values.minioBucketJob.enabled }}
{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ansibleai.fullname" . }}-minio-bucket-{{ .Release.Revision }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-bucket
  annotations:
    ansibleai.io/purpose: "Ensure the playbook bucket exists. Uses the app image and boto3; no extra MinIO client image."
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ansibleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-bucket
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ansibleai.saMigrate" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "ansibleai.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ensure-bucket
          image: {{ include "ansibleai.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ansibleai.envFrom" . | nindent 10 }}
          args:
            - exec
            - python
            - -c
            - |
              import os, sys, time
              import boto3
              from botocore.config import Config
              from botocore.exceptions import ClientError, EndpointConnectionError

              endpoint = os.environ["S3_ENDPOINT_URL"]
              bucket = os.environ["S3_BUCKET"]
              client = boto3.client(
                  "s3",
                  endpoint_url=endpoint,
                  aws_access_key_id=os.environ["S3_ACCESS_KEY"],
                  aws_secret_access_key=os.environ["S3_SECRET_KEY"],
                  region_name=os.environ.get("S3_REGION", "us-east-1"),
                  config=Config(
                      s3={"addressing_style": "path"},
                      retries={"max_attempts": 1},
                  ),
              )
              last = None
              for _ in range(30):
                  try:
                      client.head_bucket(Bucket=bucket)
                      print("bucket exists:", bucket, flush=True)
                      sys.exit(0)
                  except EndpointConnectionError as exc:
                      last = exc
                      time.sleep(2)
                  except ClientError as exc:
                      last = exc
                      code = str(exc.response.get("Error", {}).get("Code", ""))
                      http = exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode")
                      if code in {"404", "NoSuchBucket", "NotFound"} or http == 404:
                          try:
                              client.create_bucket(Bucket=bucket)
                              print("bucket created:", bucket, flush=True)
                              sys.exit(0)
                          except ClientError as create_exc:
                              last = create_exc
                              time.sleep(2)
                              continue
                      time.sleep(2)
              print("failed to ensure bucket", bucket, last, file=sys.stderr, flush=True)
              sys.exit(1)
          securityContext:
            {{- include "ansibleai.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.minioBucketJob.resources | nindent 12 }}
          volumeMounts:
            {{- include "ansibleai.tmpVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "ansibleai.tmpVolumes" . | nindent 8 }}
{{- end }}
{{- end }}
