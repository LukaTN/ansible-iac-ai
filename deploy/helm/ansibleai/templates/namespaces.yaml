{{- if .Values.namespaces.createExtras }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.identity.namespace }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
  annotations:
    ansibleai.io/purpose: "Keycloak namespace (identity.enabled). Admin is NodePort 30808, not member Ingress :30080."
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.observability }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    ansibleai.io/purpose: "Phase 6c kube-prometheus-stack / Loki / Tempo (GitOps apps in deploy/gitops/applications/)."
{{- end }}
