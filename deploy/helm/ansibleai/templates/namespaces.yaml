{{- if .Values.namespaces.createExtras }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.identity.namespace }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
  annotations:
    ansibleai.io/purpose: "Keycloak lives here when identity.enabled=true. Empty until then."
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.observability }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
  annotations:
    ansibleai.io/purpose: "Phase 6c kube-prometheus-stack / Loki / Tempo (GitOps apps in deploy/gitops/applications/)."
{{- end }}
