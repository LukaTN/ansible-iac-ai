{{- if .Values.identity.enabled }}
{{- $ns := .Values.identity.namespace }}
{{- $pgPass := .Values.secrets.postgresPassword }}
{{- $adminPass := .Values.secrets.keycloakAdminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ansibleai.secretName" .) }}
{{- if and $existing (not .Values.secrets.rotate) }}
{{- $pgPass = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- if index $existing.data "KEYCLOAK_ADMIN_PASSWORD" }}
{{- $adminPass = index $existing.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
{{- if not $adminPass }}
{{- fail "secrets.keycloakAdminPassword is required when identity.enabled=true" }}
{{- end }}
{{- if not $pgPass }}
{{- fail "secrets.postgresPassword is required when identity.enabled=true" }}
{{- end }}
{{- $realm := .Files.Get "files/realm-ansibleai.json" }}
{{- if not $realm }}
{{- fail "files/realm-ansibleai.json is missing from the chart (copy of deploy/keycloak/realm-ansibleai.json)" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  annotations:
    ansibleai.io/purpose: "Keycloak admin + shared lab Postgres password. Not a ConfigMap."
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.secrets.keycloakAdmin | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPass | quote }}
  KC_DB_USERNAME: {{ .Values.secrets.postgresUser | quote }}
  KC_DB_PASSWORD: {{ $pgPass | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: {{ $ns }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
data:
  realm-ansibleai.json: |-
{{ $realm | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  type: {{ .Values.identity.service.type }}
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.identity.service.port }}
      targetPort: http
      {{- if and (eq .Values.identity.service.type "NodePort") .Values.identity.service.nodePort }}
      nodePort: {{ .Values.identity.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  annotations:
    ansibleai.io/purpose: "Lab Keycloak 26 (start-dev). Admin NodePort only — not the member Ingress."
spec:
  replicas: {{ .Values.identity.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: ansibleai
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.identity.securityContext.runAsUser }}
        runAsGroup: {{ .Values.identity.securityContext.runAsGroup }}
        fsGroup: {{ .Values.identity.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-db
          image: {{ include "ansibleai.pinnedImage" (dict "repository" .Values.postgres.image.repository "tag" .Values.postgres.image.tag "name" "postgres") }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "ansibleai.postgresFQDN" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_DB_PASSWORD
            - name: PGDATABASE
              value: {{ .Values.identity.database | quote }}
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              until pg_isready -d postgres; do sleep 2; done
              if ! psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${PGDATABASE}'" | grep -q 1; then
                psql -d postgres -c "CREATE DATABASE \"${PGDATABASE}\";"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: keycloak
          image: {{ include "ansibleai.pinnedImage" (dict "repository" .Values.identity.image.repository "tag" .Values.identity.image.tag "name" "keycloak") }}
          imagePullPolicy: {{ .Values.identity.image.pullPolicy }}
          args:
            - start-dev
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:5432/%s" (include "ansibleai.postgresFQDN" .) .Values.identity.database | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: KC_DB_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: {{ include "ansibleai.keycloakPublicUrl" . | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx512m"
          securityContext:
            allowPrivilegeEscalation: false
            # start-dev writes under /opt/keycloak (not only /data). Compose is not read-only either.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: import
          configMap:
            name: keycloak-realm
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
