apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ansibleai.fullname" . }}-worker
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ansibleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ansibleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        ansibleai.io/purpose: "Celery agent worker. No HTTP Service. Drain via terminationGracePeriodSeconds."
    spec:
      serviceAccountName: {{ include "ansibleai.saWorker" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountServiceAccountToken }}
      securityContext:
        {{- include "ansibleai.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      initContainers:
        {{- include "ansibleai.waitPostgres" . | nindent 8 }}
        {{- include "ansibleai.waitSchema" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "ansibleai.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- include "ansibleai.envFrom" . | nindent 10 }}
          env:
            - name: APP_ROLE
              value: worker
            - name: SOCKETIO_ASYNC_MODE
              value: threading
          securityContext:
            {{- include "ansibleai.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/app/docker/entrypoint.sh", "healthcheck"]
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.liveness.failureThreshold }}
            initialDelaySeconds: 40
          readinessProbe:
            exec:
              command: ["/app/docker/entrypoint.sh", "healthcheck"]
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.readiness.failureThreshold }}
            initialDelaySeconds: 20
          volumeMounts:
            {{- include "ansibleai.tmpVolumeMounts" . | nindent 12 }}
            - name: data
              mountPath: /app/data/raw_html
              subPath: raw_html
      volumes:
        {{- include "ansibleai.tmpVolumes" . | nindent 8 }}
        - name: data
          emptyDir:
            sizeLimit: 2Gi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
