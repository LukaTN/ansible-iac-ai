{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ansibleai.fullname" . }}-default-deny
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
  annotations:
    ansibleai.io/purpose: "Default-deny now so Phase 8 is a tightening of CIDRs, not a redesign."
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ansibleai.fullname" . }}-allow-dns
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ansibleai.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ansibleai.fullname" . }}-allow-app-egress
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ansibleai.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ansibleai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "ansibleai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              {{- include "ansibleai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              {{- include "ansibleai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5000
    {{- if .Values.ollama.enabled }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.ollama.endpoint.ip | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.ollama.port }}
    {{- end }}
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.identity.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.identity.namespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ansibleai.fullname" . }}-allow-api-ingress
  labels:
    {{- include "ansibleai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ansibleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNginxNamespace }}
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - podSelector:
            matchLabels:
              {{- include "ansibleai.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5000
---
