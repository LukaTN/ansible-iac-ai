# Lab overlay for the two-node kubeadm cluster.
#
# Hypervisor ~16Gi. VMs: ansible-control .19 = 1Gi (not a node);
# k8s-master .18 = 4Gi / 4 vCPU (control plane — keep the taint);
# k8s-worker .12 = 7Gi / 4 vCPU (almost every PVC + workload).
# Requests below are pack-to-schedule (~1.3 CPU / ~4Gi), not prod SLOs.

lab:
  masterIp: "192.168.1.18"
  workerIp: "192.168.1.12"
  ansibleControlIp: "192.168.1.19"
  ingressNodePort: 30080

image:
  repository: ansibleai/app
  tag: "dev"
  pullPolicy: IfNotPresent

app:
  env: development
  authMode: local
  gunicornWorkers: "1"
  corsOrigins: ""

api:
  replicas: 1
  resources: {}

worker:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources: {}

ingress:
  enabled: true
  host: ansibleai.lab
  tlsEnabled: false
  defaultBackendToApi: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

# Lab-only placeholders so `helm template` / first install work. Rotate
# before any shared network exposure. Prefer --set or existingSecret.
secrets:
  secretKey: "lab-only-change-me-secret-key-32chars-min"
  postgresPassword: "lab-only-postgres-password"
  minioRootPassword: "lab-only-minio-password"
  bootstrapAdminEmail: "admin@localhost"
  bootstrapAdminPassword: "K8s-Lab-Bootstrap!"
  oidcClientSecret: "ansibleai-dev-oidc-secret"
  keycloakAdmin: admin
  keycloakAdminPassword: "lab-only-keycloak-admin"

ollama:
  enabled: true
  endpoint:
    ip: "192.168.1.14"

localPathProvisioner:
  enabled: true
  storageClass:
    name: local-path
    default: true

postgres:
  persistence:
    storageClass: local-path
    size: 10Gi
  resources: {}

redis:
  persistence:
    storageClass: local-path
    size: 2Gi
  resources: {}

minio:
  persistence:
    storageClass: local-path
    size: 10Gi
  resources: {}

migrate:
  resources: {}

reindex:
  resources: {}

# Keycloak admin NodePort 30808 (not :30080). AUTH_MODE stays local until patched.
identity:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: k8s-worker
  javaOptsAppend: "-Xms192m -Xmx384m"
  resources: {}

networkPolicy:
  enabled: true
  defaultDeny: true

keda:
  enabled: false

observability:
  scrape: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

celeryExporter:
  enabled: true
