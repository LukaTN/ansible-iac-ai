# Install once:  pre-commit install
# Run on everything:  pre-commit run --all-files
#
# Hooks are ordered cheapest-first so obvious problems fail fast.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(data|output|reports|raw_html)/
      - id: end-of-file-fixer
        exclude: ^(data|output|reports|raw_html)/
      - id: check-yaml
        # Generated playbooks may legitimately contain unresolved Jinja.
        exclude: ^(output|data)/
      - id: check-json
        exclude: ^(data|output|reports)/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^(config|logging_setup|models|app)\.py$|^auth/
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
          - pydantic-settings

  # Blocks committing a real .env, and catches credentials pasted into
  # source. gitleaks is the last line of defence, not the first.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # `npm --prefix` rather than `cd &&` so the hook works in cmd and
      # PowerShell as well as a POSIX shell.
      - id: frontend-lint
        name: eslint (frontend)
        language: system
        entry: npm --prefix frontend run lint --silent
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-typecheck
        name: tsc (frontend)
        language: system
        entry: npm --prefix frontend exec -- tsc --noEmit -p frontend/tsconfig.json
        files: ^frontend/(src/.*\.(ts|tsx)|tsconfig.*\.json)$
        pass_filenames: false
