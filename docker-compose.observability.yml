# =================================================================
#  AnsibleAI — Phase 6a observability (Prometheus + Grafana)
#
#  Start alongside the app stack:
#
#    docker compose --env-file .env.docker \
#      -f docker-compose.yml -f docker-compose.observability.yml up -d
#
#  UIs:
#    Prometheus  http://localhost:9090
#    Grafana     http://localhost:3001  (admin / see GRAFANA_ADMIN_*)
#
#  Langfuse is a separate compose project:
#    deploy/observability/docker-compose.langfuse.yml
# =================================================================

name: ansibleai

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  celery-exporter:
    # Phase 6b — queue length + worker count. Task histograms need worker events
    # (celery_app.py worker_send_task_events). Pin a digest-era tag, not latest.
    image: danihodovic/celery-exporter:0.12.2
    restart: unless-stopped
    environment:
      CE_BROKER_URL: redis://redis:6379/2
      CE_BUCKETS: "1,2.5,5,10,30,60,300,600,900,1800"
    ports:
      - "9808:9808"
    depends_on:
      - redis

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
