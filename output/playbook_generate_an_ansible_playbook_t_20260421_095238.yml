---
- name: Deploy Nginx to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Create namespace test-env
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        namespace: test-env
        state: present

    - name: Deploy Nginx Deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        namespace: test-env
        name: nginx
        spec:
          replicas: 3
          selector:
            matchLabels:
              app: nginx
          template:
            metadata:
              labels:
                app: nginx
            spec:
              containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                    - containerPort: 80

    - name: Expose Nginx Deployment via ClusterIP Service
      kubernetes.core.k8s:
        api_version: v1
        kind: Service
        namespace: test-env
        name: nginx-service
        spec:
          selector:
            app: nginx
          ports:
            - port: 80
              targetPort: 80
          type: ClusterIP