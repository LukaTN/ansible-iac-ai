---
- name: Copy configuration file to Kubernetes pod
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Execute command in pod to copy file
      kubernetes.core.k8s_exec:
        namespace: default
        pod: your_pod_name
        command: |
          mkdir -p /path/in/pod && cp /path/on/local/config_file /path/in/pod/