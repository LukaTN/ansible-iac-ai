---
- name: Scale web-app deployment to 5 replicas
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core

  tasks:
    - name: Scale deployment up
      kubernetes.core.k8s_scale:
        api_version: v1
        kind: Deployment
        name: web-app
        namespace: default
        replicas: 5