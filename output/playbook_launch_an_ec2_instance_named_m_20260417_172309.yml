---
- name: Launch an EC2 instance named melek-instance
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - amazon.aws
  tasks:
    - name: Create an ec2 launch template
      amazon.aws.ec2_launch_template:
        name: "melek-template"
        image_id: "ami-123456"
        instance_type: t3.small
        key_name: my_ssh_key
        security_group_ids:
          - sg-0123456789abcdef0
        subnet_id: subnet-5ca1ab1e
        tags:
          Name: melek-instance

    - name: Launch an instance using the launch template
      amazon.aws.ec2_instance:
        launch_template:
          name: "melek-template"
        count: 1
        exact_count: 1
        region: us-east-2
        state: present