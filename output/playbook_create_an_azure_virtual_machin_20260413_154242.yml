---
- name: Create Azure Virtual Machine
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - azure.azcollection
  tasks:
    - name: Create virtual machine vm-api in rg-production resource group
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: rg-production
        name: vm-api
        vm_size: Standard_DS1_v2
        image:
          publisher: Canonical
          offer: UbuntuServer
          sku: 20.04-LTS
          version: latest
        admin_username: azureuser
        ssh_password_enabled: no
        ssh_public_keys:
          - path: /home/azureuser/.ssh/authorized_keys
            key_data: "{{ lookup('file', '/path/to/public_key') }}"