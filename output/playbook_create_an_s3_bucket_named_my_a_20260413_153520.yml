        tags:
          environment: dev
          Name: my-app-backups-vault

    - name: Create a backup plan for the S3 bucket
      amazon.aws.backup_plan:
        state: present
        backup_plan_name: my-app-backup-plan
        destination_backup_vault_arn: arn:aws:backup::111122223333:backup-vault/my-app-backups-vault
        rules:
          - rule_name: daily-backup
            target_backup_vault_name: my-app-backups-vault
            schedule_expression: cron(0 0 * * ? *)
            start_window_minutes: 60
            completion_window_minutes: 120
            lifecycle:
              move_to_cold_storage_after_days: 30
