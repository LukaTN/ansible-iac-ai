---
- name: Create a Kubernetes Service of type LoadBalancer for analytics-backend deployment on port 80 targeting port 8080
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core

  tasks:
    - name: Expose http port with LoadBalancer using spec
      kubernetes.core.k8s_service:
        state: present
        name: analytics-backend
        namespace: default
        inline:
          spec:
            selector:
              app: analytics-backend
            ports:
            - port: 80
              protocol: TCP
              targetPort: 8080
              type: LoadBalancer