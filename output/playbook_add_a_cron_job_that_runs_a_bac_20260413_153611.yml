---
- name: Add a cron job for daily backup script
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - community.general
  tasks:
    - name: Ensure entry like "0 2 * * * /path/to/backup_script.sh" exists
      community.general.cronvar:
        name: backup_script_cron
        value: '0 2 * * * /path/to/backup_script.sh'
        state: present