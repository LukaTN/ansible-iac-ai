---
- name: Create Kubernetes secret named db-credentials with username and password using stringData
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core

  tasks:
    - name: Create Helm repository for storing the secret
      kubernetes.core.helm_repository:
        repo_url: "http://my-chart-repo"
        repo_password: "secretPassword"
        repo_state: present
        pass_credentials: true

    - name: Install a Helm chart that creates the Kubernetes secret
      kubernetes.core.helm_install:
        chart: my-chart
        release_name: db-credentials
        namespace: default
        wait: yes

    - name: Get the created secret's yaml
      kubernetes.core.k8s_exec:
        api_version: v1
        kind: Secret
        metadata:
          name: db-credentials
        command: ["get", "yaml"]
        container:
          image: busybox
        env:
          - name: DB_HOST
            value: kubernetes
        register: secret_yaml

    - name: Extract the username and password from the secret yaml
      set_fact:
        secret_data: "{{ secret_yaml.stdout | from_yaml.dict }}"
      when: secret_yaml.changed or secret_yaml.failed == false

    - name: Create a new Kubernetes secret with username and password using stringData
      kubernetes.core.k8s_secret:
        api_version: v1
        kind: Secret
        metadata:
          name: db-credentials-new
        data:
          username: "{{ secret_data['data']['username'] }}"
          password: "{{ secret_data['data']['password'] }}"