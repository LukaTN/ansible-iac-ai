---
- name: Create EC2 Instances in AWS
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - amazon.aws
  tasks:
    - name: Create EC2 instance 1
      amazon.aws.ec2_instance:
        key_name: var_key_name
        instance_type: t3.micro
        image_id: ami-0c55b159cbfafe1f0
        count: 1
        region: us-east-1
        vpc_subnet_id: var_vpc_subnet_id
        security_group_ids:
          - sg-0123456789abcdef0
        assign_public_ip: yes
      register: ec2_instance_1

    - name: Create EC2 instance 2
      amazon.aws.ec2_instance:
        key_name: var_key_name
        instance_type: t3.micro
        image_id: ami-0c55b159cbfafe1f0
        count: 1
        region: us-east-1
        vpc_subnet_id: var_vpc_subnet_id
        security_group_ids:
          - sg-0123456789abcdef0
        assign_public_ip: yes
      register: ec2_instance_2

    - name: Output public IPs of EC2 instances
      debug:
        msg: "Public IP of instance 1: {{ ec2_instance_1.instances[0].public_ip_address }}"
      when: ec2_instance_1.changed

    - name: Output public IPs of EC2 instances
      debug:
        msg: "Public IP of instance 2: {{ ec2_instance_2.instances[0].public_ip_address }}"
      when: ec2_instance_2.changed