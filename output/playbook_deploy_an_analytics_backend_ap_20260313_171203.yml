---
hosts: localhost
connection: local
gather_facts: no

- name: Deploy analytics-backend
  kubernetes.core.k8s:
    field_manager: local
    api_version: v1
    kind: Deployment
    metadata:
      name: analytics-backend
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: analytics-backend
      template:
        metadata:
          labels:
            app: analytics-backend
        spec:
          containers:
            - name: analytics-backend
              image: myregistry/analytics-api:latest
              ports:
                - containerPort: 8080
          imagePullSecrets:
            - name: registry-secret
          envFrom:
            - configMapRef:
                name: analytics-backend-config
            - secretRef:
                name: analytics-backend-db-credentials
          env:
            - name: DB_HOST
              value: postgres-service