---
- name: Configure CloudWatch Log Group Metric Filter for applog
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - amazon.aws
  tasks:
    - name: Set metric filter on log group applog
      amazon.aws.cloudwatchlogs_log_group_metric_filter:
        log_group_name: applog
        filter_name: ErrorFilter
        filter_pattern: 'ERROR'
        state: present
        metric_transformation:
          metric_name: error_count
          metric_namespace: application_metrics
          metric_value: 1