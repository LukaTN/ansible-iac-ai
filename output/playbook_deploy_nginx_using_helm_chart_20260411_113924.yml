---
- name: Deploy nginx using helm chart in the monitoring namespace with release name nginx-ingress
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Add stable chart repo
      kubernetes.core.helm_repository:
        name: stable
        repo_url: "https://kubernetes.github.io/ingress-nginx"

    - name: Deploy latest version of nginx-ingress chart inside monitoring namespace
      kubernetes.core.helm:
        name: nginx-ingress
        chart_ref: stable/nginx-ingress
        release_namespace: monitoring