  tasks:
    - name: Create ConfigMap for configuration values
      kubernetes.core.k8s_resource:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: analytics-config
            namespace: default
          data:
            config.yaml: |
              # Configuration values here

    - name: Create Secret for database credentials
      kubernetes.core.k8s_resource:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: analytics-secret
            namespace: default
          stringData:
            DB_HOST: postgres-service
            DB_USER: user
            DB_PASSWORD: password

    - name: Deploy analytics backend application
      kubernetes.core.k8s_resource:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: analytics-backend
            namespace: default
          spec:
