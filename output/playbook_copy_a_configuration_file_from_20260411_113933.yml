---
- name: Copy a configuration file from local machine to a Kubernetes pod in the default namespace
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Copy local configuration file to Kubernetes pod
      kubernetes.core.k8s_cp:
        namespace: default
        pod: <pod_name>
        remote_path: /path/to/remote/config/file
        local_path: /path/to/local/config/file