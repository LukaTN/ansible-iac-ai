---
- name: Deploy analytics backend application
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Create deployment using ConfigMap and Secret
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        metadata:
          name: analytics-backend
          namespace: default
        spec:
          replicas: 3
          selector:
            matchLabels:
              app: analytics-backend
          template:
            metadata:
              labels:
                app: analytics-backend
            spec:
              containers:
                - name: analytics-api
                  image: myregistry/analytics-api:latest
                  ports:
                    - containerPort: 8080
                  envFrom:
                    - configMapRef:
                        name: analytics-backend-config
                    - secretRef:
                        name: analytics-backend-secret
                  env:
                    - name: DB_HOST
                      value: postgres-service

    - name: Create service for deployment
      kubernetes.core.k8s:
        api_version: v1
        kind: Service
        metadata:
          name: analytics-backend-service
          namespace: default
        spec:
          selector:
            app: analytics-backend
          ports:
            - protocol: TCP
              port: 80
              targetPort: 8080
          type: LoadBalancer