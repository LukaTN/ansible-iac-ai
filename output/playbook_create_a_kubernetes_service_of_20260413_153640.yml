---
- name: Create LoadBalancer service for analytics-backend deployment
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Expose analytics-backend deployment with LoadBalancer
      kubernetes.core.k8s_service:
        state: present
        name: analytics-backend-service
        namespace: default
        ports:
          - port: 80
            target_port: 8080
            protocol: TCP
        selector:
          app: analytics-backend
        type: LoadBalancer