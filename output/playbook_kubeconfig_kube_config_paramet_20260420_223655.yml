---
- name: Install Helm Plugin
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - kubernetes.core
  tasks:
    - name: Install Helm Plugin
      kubernetes.core.helm_plugin:
        release_name: prometheus-stack-alpha
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_version: latest
        kubeconfig: ~/.kube/config